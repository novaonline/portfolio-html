{{- if not .Values.allowedCidrs }}
{{- fail "Configure allowedCidrs before deploying a preview" }}
{{- end }}
{{- range .Values.allowedCidrs }}
{{- if or (eq . "0.0.0.0/0") (eq . "::/0") }}
{{- fail "Public network ranges are forbidden for editorial previews" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      server_tokens off;
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header Cache-Control "no-store" always;
      {{- range .Values.allowedCidrs }}
      allow {{ . }};
      {{- end }}
      deny all;
      location / { try_files $uri $uri/ =404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app: {{ .Release.Name }} }
      annotations:
        checksum/config: {{ toJson .Values.allowedCidrs | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101 }
      containers:
        - name: site
          image: {{ required "Pin the preview image by digest" .Values.image | quote }}
          ports: [{ containerPort: 8080 }]
          readinessProbe: { tcpSocket: { port: 8080 } }
          livenessProbe: { tcpSocket: { port: 8080 } }
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/conf.d, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: {{ .Release.Name }}-nginx }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ required "Configure the preview hostname" .Values.hostname | quote }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  {{- if .Values.loadBalancerIP }}
  loadBalancerIP: {{ .Values.loadBalancerIP }}
  {{- end }}
  loadBalancerSourceRanges:
    {{- toYaml .Values.allowedCidrs | nindent 4 }}
  selector: { app: {{ .Release.Name }} }
  ports: [{ port: 80, targetPort: 8080 }]
