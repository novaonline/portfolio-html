apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels: { app: {{ .Release.Name }} }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.ingress.controllerLabels | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.runnerNamespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.runnerLabels | nindent 14 }}
      ports: [{ protocol: TCP, port: 8080 }]
